name: openwyd

x-server-environment: &server-environment
  TZ: America/Sao_Paulo
  OPENWYD_BIND_ADDRESS: 0.0.0.0
  OPENWYD_SERVER_GROUP: "0"
  OPENWYD_SERVER_INDEX: "0"

services:
  dbsrv:
    image: openwyd-server:local
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      <<: *server-environment
    working_dir: /opt/openwyd/Server/DBSRV/Run
    command: ["/opt/openwyd/bin/dbsrv"]
    volumes:
      - dbsrv-data:/opt/openwyd/Server/DBSRV/Run
      - common-data:/opt/openwyd/Server/Common
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1D5A ' /proc/net/tcp"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  tmsrv:
    image: openwyd-server:local
    pull_policy: never
    environment:
      <<: *server-environment
      OPENWYD_DB_HOST: dbsrv
      OPENWYD_DB_PORT: "7514"
    working_dir: /opt/openwyd/Server/TMSRV/Run
    command: ["/opt/openwyd/bin/tmsrv"]
    volumes:
      - tmsrv-data:/opt/openwyd/Server/TMSRV/Run
      - common-data:/opt/openwyd/Server/Common
    depends_on:
      dbsrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':2059 ' /proc/net/tcp"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 15s
    restart: unless-stopped

  wsproxy:
    image: openwyd-wsproxy:local
    build:
      context: .
      dockerfile: docker/wsproxy.Dockerfile
    command:
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8282"
      - --target-host
      - tmsrv
      - --target-port
      - "8281"
      - --no-client-target
    depends_on:
      tmsrv:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: openwyd-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      wsproxy:
        condition: service_started
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

volumes:
  common-data:
  dbsrv-data:
  tmsrv-data:
