<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preload" as="image" href="./openwyd_loading.png" fetchpriority="high" />
  <link rel="icon" href="data:," />
  <title>WYD TMProject WASM Startup Harness</title>
  <style>
    :root {
      --panel-bg: #141414;
      --panel-border: #2a2a2a;
      --text: #e2e2e2;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      font-family: monospace;
      background: #0e0e0e;
      color: var(--text);
      overflow: hidden;
    }
    .layout {
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 12px;
      width: 100%;
      height: 100%;
      padding: 12px;
    }
    body.capture .layout {
      display: block;
      padding: 0;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 10px;
    }
    body.capture .panel {
      display: none;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .debug-row {
      display: grid;
      gap: 6px;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 10px;
    }
    .debug-row label {
      display: grid;
      gap: 3px;
      font-size: 11px;
      color: #b7b7b7;
    }
    .debug-row input,
    .debug-row select {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      font: inherit;
    }
    #log {
      white-space: pre-wrap;
      line-height: 1.35;
      overflow: auto;
      min-height: 0;
      flex: 1;
      border-top: 1px solid var(--panel-border);
      padding-top: 8px;
    }
    #status { color: #a0cfff; margin-bottom: 8px; }
    #state-info { color: #b8d8ff; margin-bottom: 8px; font-size: 12px; line-height: 1.35; }
    .canvas-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: #070707;
      overflow: hidden;
      min-height: 0;
    }
    body.capture .canvas-wrap {
      width: 100vw;
      height: 100vh;
      border: 0;
      border-radius: 0;
    }
    body.play .layout {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 0;
    }
    body.play .panel {
      display: none;
    }
    body.play .canvas-wrap {
      width: 100vw;
      height: 100vh;
      border: 0;
      border-radius: 0;
      flex: 0 0 auto;
    }
    #canvas {
      width: 800px;
      height: 600px;
      max-width: 100%;
      max-height: 100%;
      display: block;
      background: #000;
      image-rendering: pixelated;
      cursor: none;
    }
    body.optimized #canvas {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      image-rendering: auto;
    }
    .display-controls {
      display: none;
    }
    body.play .display-controls {
      position: fixed;
      z-index: 20;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      padding: 7px 9px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(8, 8, 8, 0.72);
      color: #eee;
      font: 12px/1.2 system-ui, sans-serif;
      opacity: 0.72;
      transition: opacity 120ms ease;
    }
    body.play .display-controls[open] { opacity: 1; }
    .display-controls summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
      color: #f4e3bd;
    }
    .display-controls summary::-webkit-details-marker { display: none; }
    .display-settings {
      display: grid;
      min-width: 260px;
      gap: 8px;
      margin-top: 8px;
    }
    body.play .display-controls:hover,
    body.play .display-controls:focus-within {
      opacity: 1;
    }
    .display-controls label {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .display-controls select {
      color: #eee;
      border: 1px solid #555;
      border-radius: 3px;
      background: #202020;
      font: inherit;
    }
    .display-controls input[type="range"] {
      width: 112px;
      accent-color: #b67a2f;
    }
    .display-controls button {
      color: #eee;
      border: 1px solid #65543b;
      border-radius: 3px;
      padding: 4px 7px;
      background: #292118;
      font: inherit;
      cursor: pointer;
    }
    .display-section {
      display: grid;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    body.optimized #legacy-display-settings { display: none; }
    body:not(.optimized) #optimized-display-settings { display: none; }
    #optimized-metrics {
      min-height: 14px;
      color: #c9baa0;
      font-size: 10px;
    }
    #wyd-text-input {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }
    .loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px 42px;
      box-sizing: border-box;
      overflow: hidden;
      background: #070707 url('./openwyd_loading.png') center center / contain no-repeat;
      color: #f4ead0;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
      z-index: 10;
    }
    .loading-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 42%, rgba(0, 0, 0, 0.82) 100%),
        radial-gradient(circle at center, transparent 48%, rgba(0, 0, 0, 0.42) 100%);
      pointer-events: none;
    }
    .loading-panel {
      position: relative;
      width: min(520px, calc(100% - 24px));
      padding: 13px 18px 11px;
      box-sizing: border-box;
      border: 1px solid rgba(204, 166, 100, 0.72);
      border-radius: 3px;
      background: linear-gradient(
        to bottom,
        rgba(29, 24, 20, 0.91),
        rgba(9, 8, 7, 0.95)
      );
      box-shadow:
        0 0 0 1px rgba(15, 10, 7, 0.88),
        0 8px 28px rgba(0, 0, 0, 0.62),
        inset 0 1px rgba(255, 236, 194, 0.18);
    }
    .loading-message {
      margin-bottom: 7px;
      color: #fff3d3;
      font-size: 13px;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px #000;
    }
    .loading-progress {
      position: relative;
      height: 10px;
      overflow: hidden;
      border: 1px solid #130e09;
      border-radius: 2px;
      background: #080706;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    .loading-progress-fill {
      display: block;
      width: 2%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        #f2d08d 0%,
        #b67a2f 45%,
        #744116 100%
      );
      box-shadow: 0 0 8px rgba(236, 178, 80, 0.7);
      transition: width 140ms ease-out;
    }
    .loading-detail {
      min-height: 16px;
      margin-top: 5px;
      color: #c9baa0;
      font-size: 11px;
      text-shadow: 0 1px 1px #000;
    }
    body.play.loading .loading-overlay {
      display: flex;
    }
    .ok { color: #7CFC7C; }
    .err { color: #ff7070; }
    h3 { margin: 0 0 10px 0; font-size: 14px; }
  </style>
</head>
<body>
  <details id="display-controls" class="display-controls" aria-label="Opções de exibição">
    <summary>Exibição &#9881;</summary>
    <div class="display-settings">
      <label>Modo
        <select id="display-mode">
          <option value="optimized">Otimizado</option>
          <option value="legacy">Legado</option>
        </select>
      </label>
      <div id="optimized-display-settings" class="display-section">
        <label>Qualidade
          <select id="optimized-quality">
            <option value="auto">Automática</option>
            <option value="performance">Desempenho</option>
            <option value="quality">Qualidade</option>
            <option value="maximum">Máxima</option>
          </select>
        </label>
        <label>Interface
          <input id="optimized-ui-scale" type="range" min="80" max="100" step="5" value="100" />
          <span id="optimized-ui-scale-value">100%</span>
        </label>
        <label>FPS
          <select id="optimized-fps">
            <option value="auto">Automático</option>
            <option value="60">60</option>
            <option value="75">75</option>
            <option value="120">120</option>
            <option value="144">144</option>
          </select>
        </label>
        <div id="optimized-metrics" aria-live="polite"></div>
      </div>
      <div id="legacy-display-settings" class="display-section">
        <label>Resolução
          <select id="display-resolution">
            <option value="640x480">640×480</option>
            <option value="800x600">800×600</option>
            <option value="1024x768">1024×768</option>
            <option value="1280x1024">1280×1024</option>
            <option value="1600x1200">1600×1200</option>
          </select>
        </label>
        <label>Exibição
          <select id="display-fit">
            <option value="actual">Tamanho original</option>
            <option value="contain">Ampliar mantendo proporção</option>
          </select>
        </label>
      </div>
      <button id="fullscreen-btn" type="button">Tela cheia</button>
    </div>
  </details>
  <div class="layout">
    <div class="panel">
      <h3>TMProject Startup Harness (_wyd_start_client)</h3>
      <div id="status">status: loading runtime...</div>
      <div id="state-info">state: unavailable</div>
      <div class="controls">
        <button id="boot-btn">Boot Client</button>
        <button id="tick-btn">Tick Once</button>
        <button id="tick120-btn">Tick 120 Frames</button>
        <button id="auto-btn">Toggle Auto Tick</button>
        <select id="screen-select">
          <option value="-1">None</option>
          <option value="0">Field</option>
          <option value="1">Test2</option>
          <option value="2">Sea</option>
          <option value="3">Login</option>
          <option value="4">Create ID</option>
          <option value="5">Select Character</option>
          <option value="6">Create Character</option>
          <option value="7">Select Server</option>
          <option value="8">Demo</option>
          <option value="9">Field2</option>
        </select>
        <button id="set-state-btn">Set State</button>
        <button id="stats-btn">Read Runtime Stats</button>
        <button id="shutdown-btn">Shutdown Client</button>
      </div>
      <div class="debug-row">
        <label>Server host
          <input id="debug-host" value="" placeholder="official host or IP" />
        </label>
        <label>Socket proxy
          <input id="socket-proxy" />
        </label>
        <label>Account
          <input id="debug-account" value="OPENWYD01" />
        </label>
        <label>Password
          <input id="debug-password" value="TEST1234" />
        </label>
      </div>
      <div class="controls">
        <button id="dummy-login-btn">Dummy Login</button>
      </div>
      <div id="log">loading...</div>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas" width="800" height="600" tabindex="0"></canvas>
      <textarea id="wyd-text-input" aria-hidden="true" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" tabindex="-1"></textarea>
      <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-panel">
          <div id="loading-message" class="loading-message">Preparando o mundo de OpenWyd...</div>
          <div id="loading-progress" class="loading-progress" role="progressbar"
            aria-label="Carregamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="loading-progress-fill" class="loading-progress-fill"></span>
          </div>
          <div id="loading-detail" class="loading-detail">Verificando arquivos salvos...</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const stateInfoEl = document.getElementById('state-info');
    const canvasEl = document.getElementById('canvas');
    const textInputEl = document.getElementById('wyd-text-input');
    const loadingOverlayEl = document.getElementById('loading-overlay');
    const loadingMessageEl = document.getElementById('loading-message');
    const loadingProgressEl = document.getElementById('loading-progress');
    const loadingProgressFillEl = document.getElementById('loading-progress-fill');
    const loadingDetailEl = document.getElementById('loading-detail');
    const displayControlsEl = document.getElementById('display-controls');
    const displayModeEl = document.getElementById('display-mode');
    const displayResolutionEl = document.getElementById('display-resolution');
    const displayFitEl = document.getElementById('display-fit');
    const optimizedQualityEl = document.getElementById('optimized-quality');
    const optimizedUiScaleEl = document.getElementById('optimized-ui-scale');
    const optimizedUiScaleValueEl = document.getElementById('optimized-ui-scale-value');
    const optimizedFpsEl = document.getElementById('optimized-fps');
    const optimizedMetricsEl = document.getElementById('optimized-metrics');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const bootBtn = document.getElementById('boot-btn');
    const tickBtn = document.getElementById('tick-btn');
    const tick120Btn = document.getElementById('tick120-btn');
    const autoBtn = document.getElementById('auto-btn');
    const screenSelect = document.getElementById('screen-select');
    const setStateBtn = document.getElementById('set-state-btn');
    const statsBtn = document.getElementById('stats-btn');
    const shutdownBtn = document.getElementById('shutdown-btn');
    const debugHostInput = document.getElementById('debug-host');
    const socketProxyInput = document.getElementById('socket-proxy');
    const debugAccountInput = document.getElementById('debug-account');
    const debugPasswordInput = document.getElementById('debug-password');
    const dummyLoginBtn = document.getElementById('dummy-login-btn');
    const MAX_LOG_LINES = 800;
    let lineCount = 0;
    let autoTickRunning = false;
    let autoTickFrames = 0;
    let schedulerLastRaf = 0;
    let schedulerLastTick = 0;
    let schedulerLastEvaluation = 0;
    let schedulerStableSince = 0;
    let schedulerSimulationAccumulator = 0;
    let schedulerLastPresentation = 0;
    let schedulerRefreshHz = 60;
    let adaptiveFpsCap = 144;
    const schedulerRafDeltas = [];
    const schedulerTickDurations = [];
    const schedulerFrameDeltas = [];
    window.__runtimeReady = false;
    const query = new URLSearchParams(window.location.search);
    const publicPlayMode = query.get('mode') === 'play';
    const publicDemoMode = query.get('demo') === '1';
    const LAST_STATE_STORAGE_KEY = 'openwyd.lastState';
    const DEMO_ACCOUNT_STORAGE_KEY = 'openwyd.publicDemoAccount.v1';
    const DISPLAY_RESOLUTION_STORAGE_KEY = 'openwyd.displayResolution.v1';
    const DISPLAY_FIT_STORAGE_KEY = 'openwyd.displayFit.v1';
    const DISPLAY_MODE_STORAGE_KEY = 'openwyd.displayMode.v2';
    const OPTIMIZED_QUALITY_STORAGE_KEY = 'openwyd.optimizedQuality.v1';
    const OPTIMIZED_UI_SCALE_STORAGE_KEY = 'openwyd.optimizedUiScale.v1';
    const OPTIMIZED_FPS_STORAGE_KEY = 'openwyd.optimizedFps.v1';
    const DISPLAY_RESOLUTIONS = new Set([
      '640x480', '800x600', '1024x768', '1280x1024', '1600x1200'
    ]);
    const DISPLAY_MODES = new Set(['optimized', 'legacy']);
    const QUALITY_PROFILES = new Set(['auto', 'performance', 'quality', 'maximum']);
    const FPS_CHOICES = new Set(['auto', '60', '75', '120', '144']);
    const DEMO_TOKEN_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const randomDemoToken = (length) => {
      const bytes = new Uint8Array(length);
      if (window.crypto?.getRandomValues) {
        window.crypto.getRandomValues(bytes);
      } else {
        for (let i = 0; i < bytes.length; i += 1) {
          bytes[i] = Math.floor(Math.random() * 256);
        }
      }
      return Array.from(bytes, value => DEMO_TOKEN_ALPHABET[value % DEMO_TOKEN_ALPHABET.length]).join('');
    };
    const readOrCreateDemoCredentials = () => {
      try {
        const stored = JSON.parse(window.localStorage?.getItem(DEMO_ACCOUNT_STORAGE_KEY) || 'null');
        if (stored && /^DEMO[A-Z2-9]{8}$/.test(stored.account) &&
            /^[A-Z2-9]{11}$/.test(stored.password)) {
          return stored;
        }
      } catch {
        // A fresh demo account is enough when storage is unavailable or corrupt.
      }

      const credentials = {
        account: `DEMO${randomDemoToken(8)}`,
        password: randomDemoToken(11)
      };
      try {
        window.localStorage?.setItem(DEMO_ACCOUNT_STORAGE_KEY, JSON.stringify(credentials));
      } catch {
        // Private browsing can reject storage; this session can still log in.
      }
      return credentials;
    };
    const demoCredentials = publicDemoMode ? readOrCreateDemoCredentials() : null;
    let demoLoginSubmitted = false;
    let demoLoginSubmittedFrame = 0;
    let demoSelectionUnlocked = false;
    const screenStates = {
      none: -1,
      field: 0,
      test2: 1,
      sea: 2,
      login: 3,
      createid: 4,
      createaccount: 4,
      selectchar: 5,
      char: 5,
      createchar: 6,
      selectserver: 7,
      server: 7,
      demo: 8,
      field2: 9
    };
    const queryScreen = (query.get('screen') || '').toLowerCase();
    const queryState = Number.parseInt(query.get('state') || '', 10);
    const isValidState = (value) => Number.isFinite(value) && value >= -1 && value <= 9;
    const readStoredState = () => {
      try {
        const stored = Number.parseInt(window.localStorage?.getItem(LAST_STATE_STORAGE_KEY) || '', 10);
        return isValidState(stored) ? stored : null;
      } catch {
        return null;
      }
    };
    const writeStoredState = (value) => {
      if (!isValidState(value)) return;
      try {
        window.localStorage?.setItem(LAST_STATE_STORAGE_KEY, String(value));
      } catch {
        // Storage can be unavailable in private/cross-origin contexts; the harness still works.
      }
    };
    const resolveInitialState = () => {
      if (publicDemoMode) return screenStates.selectserver;
      if (query.has('state') && isValidState(queryState)) return queryState;
      if (query.has('screen') && Object.prototype.hasOwnProperty.call(screenStates, queryScreen)) return screenStates[queryScreen];
      const stored = readStoredState();
      return stored == null ? 0 : stored;
    };
    const parseSize = (value) => {
      const match = String(value || '').match(/^(\d+)x(\d+)$/i);
      if (!match) return null;
      const width = Number.parseInt(match[1], 10);
      const height = Number.parseInt(match[2], 10);
      if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) return null;
      return { width, height };
    };
    const readDisplayPreference = (key) => {
      try {
        return window.localStorage?.getItem(key) || '';
      } catch {
        return '';
      }
    };
    const writeDisplayPreference = (key, value) => {
      try {
        window.localStorage?.setItem(key, value);
      } catch {
        // Display preferences are optional in private browsing contexts.
      }
    };
    const requestedLogicalSize = parseSize(query.get('logical')) || parseSize(query.get('canvas'));
    const requestedResolution = requestedLogicalSize
      ? `${requestedLogicalSize.width}x${requestedLogicalSize.height}`
      : '';
    const publicResolution = DISPLAY_RESOLUTIONS.has(requestedResolution)
      ? requestedResolution
      : (DISPLAY_RESOLUTIONS.has(readDisplayPreference(DISPLAY_RESOLUTION_STORAGE_KEY))
          ? readDisplayPreference(DISPLAY_RESOLUTION_STORAGE_KEY)
          : '800x600');
    const requestedFit = query.get('fit') || '';
    const publicFit = requestedFit === 'actual' || requestedFit === 'contain'
      ? requestedFit
      : (readDisplayPreference(DISPLAY_FIT_STORAGE_KEY) === 'contain' ? 'contain' : 'actual');
    const requestedDisplayMode = query.get('displayMode') || query.get('display') || '';
    const storedDisplayMode = readDisplayPreference(DISPLAY_MODE_STORAGE_KEY);
    const publicDisplayMode = publicPlayMode
      ? (DISPLAY_MODES.has(requestedDisplayMode)
          ? requestedDisplayMode
          : (DISPLAY_MODES.has(storedDisplayMode) ? storedDisplayMode : 'optimized'))
      : 'legacy';
    const requestedQuality = query.get('quality') || '';
    const storedQuality = readDisplayPreference(OPTIMIZED_QUALITY_STORAGE_KEY);
    const optimizedQuality = QUALITY_PROFILES.has(requestedQuality)
      ? requestedQuality
      : (QUALITY_PROFILES.has(storedQuality) ? storedQuality : 'auto');
    const requestedUiScale = Number.parseInt(query.get('uiScale') || '', 10);
    const storedUiScale = Number.parseInt(readDisplayPreference(OPTIMIZED_UI_SCALE_STORAGE_KEY), 10);
    const optimizedUiScale = Math.max(80, Math.min(100,
      Number.isFinite(requestedUiScale)
        ? requestedUiScale
        : (Number.isFinite(storedUiScale) ? storedUiScale : 100)));
    const requestedFps = query.get('fps') || '';
    const storedFps = readDisplayPreference(OPTIMIZED_FPS_STORAGE_KEY);
    const optimizedFps = FPS_CHOICES.has(requestedFps)
      ? requestedFps
      : (FPS_CHOICES.has(storedFps) ? storedFps : 'auto');
    const defaultSocketProxyUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`;
    const autoConfig = {
      state: resolveInitialState(),
      debugFlags: Number.parseInt(query.get('debugFlags') || '0', 10) || 0,
      skipFvf: Number.parseInt(query.get('skipFvf') || '0', 10) || 0,
      tickBurst: Number.parseInt(query.get('tickBurst') || '0', 10) || 0,
      // Live play follows the browser clock. Deterministic tests opt into fake
      // time explicitly with ?tickMs=N.
      tickMs: Number.parseInt(query.get('tickMs') || '0', 10) || 0,
      autoboot: query.get('autoboot') !== '0',
      autostart: query.get('autostart') !== '0',
      quiet: query.get('quiet') === '1',
      layout: query.get('layout') || 'panel',
      displayMode: publicDisplayMode,
      quality: optimizedQuality,
      renderer: query.get('renderer') === 'native-webgl2' ? 'native-webgl2' : 'bridge',
      uiScale: optimizedUiScale,
      fps: optimizedFps,
      fit: publicPlayMode ? publicFit : (query.get('fit') || 'actual'),
      fieldMode: (query.get('fieldMode') || query.get('field') || 'real').toLowerCase(),
      logicalSize: publicPlayMode
        ? parseSize(publicResolution)
        : (requestedLogicalSize || { width: 800, height: 600 }),
      socketProxyUrl: query.get('socketProxy') || defaultSocketProxyUrl,
      debugHost: query.get('host') || (demoCredentials ? 'tmsrv' : ''),
      debugAccount: demoCredentials?.account || query.get('account') || 'ADMIN',
      debugPassword: demoCredentials?.password || query.get('password') || 'admin'
    };
    screenSelect.value = String(autoConfig.state);
    socketProxyInput.value = autoConfig.socketProxyUrl;
    debugHostInput.value = autoConfig.debugHost;
    debugAccountInput.value = autoConfig.debugAccount;
    debugPasswordInput.value = autoConfig.debugPassword;
    displayResolutionEl.value = `${autoConfig.logicalSize.width}x${autoConfig.logicalSize.height}`;
    displayFitEl.value = autoConfig.fit;
    displayModeEl.value = autoConfig.displayMode;
    optimizedQualityEl.value = autoConfig.quality;
    optimizedUiScaleEl.value = String(autoConfig.uiScale);
    optimizedUiScaleValueEl.textContent = `${autoConfig.uiScale}%`;

    } else if (autoConfig.layout === 'capture') {
      document.body.classList.add('capture');
    }

    let loadingPercent = 0;
    let loadingDownloadComplete = false;
    let loadingDependencyCount = 0;
    let loadingDependencyMaximum = 0;
    const setLoadingProgress = (percent) => {
      loadingPercent = Math.max(loadingPercent, Math.min(100, Math.round(percent)));
      loadingProgressFillEl.style.width = `${Math.max(2, loadingPercent)}%`;
      loadingProgressEl.setAttribute('aria-valuenow', String(loadingPercent));
    };

    const setLoadingDependencies = (left) => {
      loadingDependencyCount = Math.max(0, Number(left) || 0);
      loadingDependencyMaximum = Math.max(loadingDependencyMaximum, loadingDependencyCount);

      // The file packager registers every virtual file before it has decided
      // whether the data comes from IndexedDB or the network.  Showing that
      // initial dependency count as 96% made the bar jump before the download.
      if (!loadingDownloadComplete) return;

      if (loadingDependencyCount > 0) {
        const completed = loadingDependencyMaximum > 0
          ? 1 - loadingDependencyCount / loadingDependencyMaximum
          : 0;
        setLoadingProgress(94 + completed * 4);
        loadingMessageEl.textContent = 'Montando o mundo de OpenWyd...';
        loadingDetailEl.textContent = `${loadingDependencyCount} componentes restantes`;
        return;
      }

      setLoadingProgress(98);
      loadingMessageEl.textContent = 'Iniciando o cliente...';
      loadingDetailEl.textContent = 'Aguarde só mais um instante.';
    };

    const formatLoadingBytes = (bytes) => {
      if (!Number.isFinite(bytes) || bytes <= 0) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toFixed(unit > 1 ? 1 : 0)} ${units[unit]}`;
    };

    const setLoadingStatus = (message) => {
      if (!publicPlayMode || !loadingOverlayEl) return;
      const raw = String(message || '');
      const download = raw.match(/Downloading data\.\.\. \((\d+)\/(\d+)\)/);
      if (download) {
        const loaded = Number(download[1]);
        const reportedTotal = Number(download[2]);
        const total = Number(window.__openwydAssetDataBytes) || reportedTotal;
        const percent = total > 0 ? loaded * 94 / total : 2;
        setLoadingProgress(percent);
        loadingMessageEl.textContent = 'Baixando os arquivos do mundo...';
        loadingDetailEl.textContent = total > 0
          ? `${formatLoadingBytes(loaded)} de ${formatLoadingBytes(total)} · ${Math.round(loaded * 100 / total)}%`
          : 'Conectando ao servidor de arquivos...';
        if (total > 0 && loaded >= total) {
          loadingDownloadComplete = true;
          setLoadingDependencies(loadingDependencyCount);
        }
        return;
      }
      if (/Downloading data|Downloading/.test(raw)) {
        const fromCache = Object.values(window.Module?.preloadResults || {})
          .some(result => result && result.fromCache);
        if (fromCache) {
          loadingDownloadComplete = true;
          setLoadingProgress(loadingDependencyCount > 0 ? 94 : 98);
          loadingMessageEl.textContent = 'Carregando os arquivos salvos neste navegador...';
          loadingDetailEl.textContent = 'Cache local encontrado; nenhum download completo é necessário.';
          if (loadingDependencyCount > 0) setLoadingDependencies(loadingDependencyCount);
        } else if (loadingDownloadComplete) {
          setLoadingDependencies(loadingDependencyCount);
        } else {
          setLoadingProgress(Math.max(loadingPercent, 2));
          loadingMessageEl.textContent = 'Preparando os arquivos do mundo...';
          loadingDetailEl.textContent = 'O primeiro acesso pode levar um pouco mais de tempo.';
        }
        return;
      }
      const dependencies = raw.match(/\((\d+) runtime dependencies remaining\)/);
      if (dependencies) {
        setLoadingDependencies(Number(dependencies[1]));
        return;
      }
      if (/Criando sua conta/.test(raw)) {
        setLoadingProgress(98);
        loadingMessageEl.textContent = 'Criando sua conta de demonstração...';
        loadingDetailEl.textContent = 'Preparando seus personagens e equipamentos.';
        return;
      }
      setLoadingProgress(96);
      loadingMessageEl.textContent = 'Iniciando o cliente...';
      loadingDetailEl.textContent = 'Aguarde só mais um instante.';
    };

    const hideLoadingOverlay = () => {

    const QUALITY_PROFILE_CODES = Object.freeze({
      auto: 0,
      performance: 1,
      quality: 2,
      maximum: 3

    let adaptiveResolutionScale = 1;
    let resizeFrame = 0;

        case 'quality': return Math.min(2, dpr);
        case 'maximum': return Math.min(3, dpr);
        default: return Math.min(1.5, dpr);

        cssWidth,
        cssHeight,

        backingHeight,
        autoConfig.uiScale,
        Math.round(optimizedWorldScale() * 100)

    };

    const syncCanvasSize = () => {
      if (autoConfig.displayMode === 'optimized') {
        const wrap = canvasEl.parentElement;
        const rect = publicPlayMode
          ? { width: window.innerWidth, height: window.innerHeight }
          : (wrap ? wrap.getBoundingClientRect() : { width: 800, height: 600 });
        const cssWidth = Math.max(320, Math.round(rect.width));
        const cssHeight = Math.max(320, Math.round(rect.height));
        let pixelScale = optimizedPixelScale();
        const requestedPixels = cssWidth * cssHeight * pixelScale * pixelScale;
        if (requestedPixels > MAX_OPTIMIZED_BACKING_PIXELS) {
          pixelScale *= Math.sqrt(MAX_OPTIMIZED_BACKING_PIXELS / requestedPixels);
        }
        const backingWidth = Math.max(320, Math.round(cssWidth * pixelScale));
        const backingHeight = Math.max(320, Math.round(cssHeight * pixelScale));

        if (canvasEl.width !== backingWidth || canvasEl.height !== backingHeight) {
          canvasEl.width = backingWidth;
          canvasEl.height = backingHeight;

        canvasEl.style.width = `${cssWidth}px`;
        canvasEl.style.height = `${cssHeight}px`;

      if (canvasEl.width !== logical.width || canvasEl.height !== logical.height) {

        canvasEl.height = logical.height;
      }

      const wrap = canvasEl.parentElement;
      const rect = publicPlayMode
        ? { width: window.innerWidth, height: window.innerHeight }
        : (wrap ? wrap.getBoundingClientRect() : { width: logical.width, height: logical.height });
      const maxWidth = Math.max(1, rect.width);
      const maxHeight = Math.max(1, rect.height);
      const aspect = logical.width / logical.height;
      let displayWidth = logical.width;
      let displayHeight = logical.height;

      const shouldContain = autoConfig.fit === 'contain';
      if (shouldContain || displayWidth > maxWidth || displayHeight > maxHeight) {
        displayWidth = maxWidth;
        displayHeight = displayWidth / aspect;
        if (displayHeight > maxHeight) {

          displayWidth = displayHeight * aspect;

      canvasEl.style.height = `${Math.round(displayHeight)}px`;
      window.__wydViewport = {
        mode: 'legacy', cssWidth: displayWidth, cssHeight: displayHeight,
        backingWidth: logical.width, backingHeight: logical.height,
        pixelScale: 1, uiScale: 100

    };

        placeholder: typeof M._wyd_state_is_placeholder === 'function' ? M._wyd_state_is_placeholder() : null,
        label: moduleString('_wyd_get_state_debug_label'),

        fieldHuman: typeof M._wyd_field_has_my_human === 'function' ? M._wyd_field_has_my_human() : null,
        fieldMapX: typeof M._wyd_field_map_x === 'function' ? M._wyd_field_map_x() : null,
        fieldMapY: typeof M._wyd_field_map_y === 'function' ? M._wyd_field_map_y() : null,
        criticalType: typeof M._wyd_debug_last_critical_type === 'function' ? M._wyd_debug_last_critical_type() : null
      };
    };

    const refreshStateInfo = () => {
      const info = readStateDebug();
      const field = info.gameState === 0 || info.fieldFixture
        ? ` fieldMode=${info.fieldMode} fixture=${info.fieldFixture} ground=${info.fieldGround} human=${info.fieldHuman} map=${info.fieldMapX},${info.fieldMapY} critical=${info.criticalType}`
        : '';
      stateInfoEl.textContent = `state: requested=${info.requestedState} actual=${info.gameState} scene=${info.sceneType} placeholder=${info.placeholder} ${info.label || ''}${field}`;
      return info;
    };

    const write = (msg, cls = '') => {
      if (autoConfig.quiet) return;
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = msg;
      logEl.appendChild(line);
      lineCount += 1;
      while (lineCount > MAX_LOG_LINES && logEl.firstChild) {
        logEl.removeChild(logEl.firstChild);

    syncCanvasSize();
    refreshStateInfo();

    window.__wydHarnessConfig = {
      logicalWidth: autoConfig.logicalSize.width,
      logicalHeight: autoConfig.logicalSize.height,
      displayMode: autoConfig.displayMode,

      uiScale: autoConfig.uiScale,
      fps: autoConfig.fps,
      fit: autoConfig.fit,
      tickMs: autoConfig.tickMs,
      fieldMode: autoConfig.fieldMode
    };

    const WM_MOUSEMOVE = 0x0200;
    const WM_LBUTTONDOWN = 0x0201;
    const WM_LBUTTONUP = 0x0202;
    const WM_LBUTTONDBLCLK = 0x0203;
    const WM_RBUTTONDOWN = 0x0204;
    const WM_RBUTTONUP = 0x0205;
    const WM_RBUTTONDBLCLK = 0x0206;
    const WM_MBUTTONDOWN = 0x0207;
    const WM_MBUTTONUP = 0x0208;
    const WM_MOUSEWHEEL = 0x020A;
    const WM_KEYDOWN = 0x0100;
    const WM_KEYUP = 0x0101;
    const WM_CHAR = 0x0102;
    const WM_SYSKEYDOWN = 0x0104;
    const WM_SYSKEYUP = 0x0105;
    const MK_LBUTTON = 0x0001;
    const MK_RBUTTON = 0x0002;
    const MK_SHIFT = 0x0004;
    const MK_CONTROL = 0x0008;
    const MK_MBUTTON = 0x0010;
    let lastMousePoint = { x: Math.floor(canvasEl.width / 2), y: Math.floor(canvasEl.height / 2) };

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const canvasLogicalPoint = (event) => {
      const rect = canvasEl.getBoundingClientRect();
      const optimized = autoConfig.displayMode === 'optimized';
      const logicalWidth = optimized
        ? (Module?._wyd_optimized_css_width?.() || Math.round(rect.width))
        : canvasEl.width;
      const logicalHeight = optimized
        ? (Module?._wyd_optimized_css_height?.() || Math.round(rect.height))
        : canvasEl.height;
      const scaleX = rect.width > 0 ? logicalWidth / rect.width : 1;
      const scaleY = rect.height > 0 ? logicalHeight / rect.height : 1;
      const x = clamp(Math.round((event.clientX - rect.left) * scaleX), 0, Math.max(0, logicalWidth - 1));
      const y = clamp(Math.round((event.clientY - rect.top) * scaleY), 0, Math.max(0, logicalHeight - 1));
      lastMousePoint = { x, y };
      return lastMousePoint;
    };
    const mouseWParam = (event, buttons = event?.buttons || 0) => {
      let wParam = 0;
      if (buttons & 1) wParam |= MK_LBUTTON;
      if (buttons & 2) wParam |= MK_RBUTTON;
      if (buttons & 4) wParam |= MK_MBUTTON;
      if (event?.shiftKey) wParam |= MK_SHIFT;
      if (event?.ctrlKey) wParam |= MK_CONTROL;

    };

      const doubleClick = down && clickCount > 0 && clickCount % 2 === 0;

        return down ? WM_RBUTTONDOWN : WM_RBUTTONUP;

      Module._wyd_mouse_event(WM_MBUTTONUP, 0, lastMousePoint.x | 0, lastMousePoint.y | 0, 0);
    };
    canvasEl.addEventListener('contextmenu', (event) => event.preventDefault());
    canvasEl.addEventListener('mousemove', (event) => {
      sendMouseEvent(WM_MOUSEMOVE, event);
    });
    window.addEventListener('mousemove', (event) => {
      if (event.target === canvasEl || !event.buttons) return;
      sendMouseEvent(WM_MOUSEMOVE, event);
    });

      event.preventDefault();
      resumeClientAudio();
      canvasEl.focus({ preventScroll: true });
      sendMouseEvent(mouseMsgForButton(event.button, true, event.detail), event);
      queueMicrotask(syncTextInputFocus);
    });
    window.addEventListener('mouseup', (event) => {
      sendMouseEvent(mouseMsgForButton(event.button, false), event);
    });

    const heldKeys = new Set();
    let textInputComposing = false;
    let suppressCommittedText = '';

      [0x2030, 0x89], [0x0160, 0x8A], [0x2039, 0x8B], [0x0152, 0x8C],
      [0x017D, 0x8E], [0x2018, 0x91], [0x2019, 0x92], [0x201C, 0x93],
      [0x201D, 0x94], [0x2022, 0x95], [0x2013, 0x96], [0x2014, 0x97],
      [0x02DC, 0x98], [0x2122, 0x99], [0x0161, 0x9A], [0x203A, 0x9B],

    const syncTextInputFocus = () => {

          textInputEl.focus({ preventScroll: true });
        }

        textInputEl.blur();

    };
    const routeKeyboardToClient = () =>

          wireframeDraws: typeof Module._wyd_d3d9_wireframe_draws === 'function' ? Module._wyd_d3d9_wireframe_draws() : null,
          materialSetCalls: typeof Module._wyd_d3d9_material_set_calls === 'function' ? Module._wyd_d3d9_material_set_calls() : null,
          lightSetCalls: typeof Module._wyd_d3d9_light_set_calls === 'function' ? Module._wyd_d3d9_light_set_calls() : null,
          lightEnableCalls: typeof Module._wyd_d3d9_light_enable_calls === 'function' ? Module._wyd_d3d9_light_enable_calls() : null,
          lightedVertices: typeof Module._wyd_d3d9_lighted_vertices === 'function' ? Module._wyd_d3d9_lighted_vertices() : null
        };
        write(`runtime stats: ${JSON.stringify(stats)}`, 'ok');
      } catch (err) {
        write(`read stats failed: ${err?.message || err}`, 'err');
      }
    };

    bootBtn.addEventListener('click', () => {
      write('invoking _wyd_boot_client ...');
      window.bootClient();
    });

    tickBtn.addEventListener('click', () => {
      window.tickClient();
    });

    tick120Btn.addEventListener('click', () => {
      let left = 120;
      let failures = 0;
      const step = () => {
        if (left <= 0) {
          write(`tick burst finished (120), failures=${failures}`, failures ? 'err' : 'ok');
          setStatus(`tick burst complete, failures=${failures}`);
          return;
        }
        left -= 1;
        const rc = window.tickClient(true, true);
        if (rc < 0) failures += 1;
        requestAnimationFrame(step);
      };
      write('starting tick burst (120) ...');
      step();
    });

    autoBtn.addEventListener('click', () => {
      if (autoTickRunning) window.stopAutoTick();
      else window.startAutoTick();
    });

    setStateBtn.addEventListener('click', () => {
      window.setGameState(Number(screenSelect.value || 7));
    });

    dummyLoginBtn.addEventListener('click', () => {
      window.runDummyLogin();
    });

    statsBtn.addEventListener('click', () => {
      window.readRuntimeStats();
    });

    shutdownBtn.addEventListener('click', () => {
      write('invoking _wyd_shutdown_client ...');
      window.stopAutoTick();
      window.shutdownClient();
    });

    window.Module = {
      canvas: canvasEl,
      wydSocketProxyUrl: autoConfig.socketProxyUrl,
      setStatus: (message) => {
        setLoadingStatus(message);
      },
      monitorRunDependencies: (left) => {
        setLoadingDependencies(left);
      },
      print: (txt) => write(`[stdout] ${txt}`),
      printErr: (txt) => write(`[stderr] ${txt}`, 'err'),
      onRuntimeInitialized() {
        window.__runtimeReady = true;
        write('runtime initialized', 'ok');
        setStatus('runtime initialized; booting client');
        syncCanvasSize();
        if (typeof Module._wyd_renderer_set_backend === 'function') {
          Module._wyd_renderer_set_backend(
            autoConfig.displayMode === 'optimized' && autoConfig.renderer === 'native-webgl2'
              ? 1
              : 0
          );
        }
        applyFieldMode();
        if (!autoConfig.autoboot) {
          setStatus('runtime initialized; autoboot disabled');
          return;
        }
        const boot = window.bootClient();
        if (boot) {
          if (autoConfig.displayMode === 'optimized' &&
              typeof Module._wyd_d3d9_is_webgl2 === 'function' &&
              Module._wyd_d3d9_is_webgl2() !== 1) {
            writeDisplayPreference(DISPLAY_MODE_STORAGE_KEY, 'legacy');
            loadingMessageEl.textContent = 'WebGL2 não está disponível neste navegador.';
            loadingDetailEl.textContent = 'Abrindo o modo legado compatível...';
            setTimeout(() => {
              const target = new URL(window.location.href);
              target.searchParams.set('displayMode', 'legacy');
              window.location.replace(target.toString());
            }, 900);
            return;
          }
          window.setGameState(autoConfig.state);
          refreshStateInfo();
          if (typeof Module._wyd_d3d9_set_debug_flags === 'function') {
            Module._wyd_d3d9_set_debug_flags(autoConfig.debugFlags >>> 0);
          }
          if (typeof Module._wyd_d3d9_set_debug_skip_fvf === 'function') {
            Module._wyd_d3d9_set_debug_skip_fvf(autoConfig.skipFvf >>> 0);
          }
          if (typeof Module._wyd_d3d9_reset_debug_counters === 'function') {
            Module._wyd_d3d9_reset_debug_counters();
          }
          if (autoConfig.tickBurst > 0) {
            window.runTickBurstSync(autoConfig.tickBurst);
          }
          if (autoConfig.autostart) {
            window.startAutoTick();
            if (publicDemoMode) {
              setLoadingStatus('Criando sua conta de demonstração...');
            } else {
              hideLoadingOverlay();
            }
          } else {
            setStatus('runtime initialized; autostart disabled');
            hideLoadingOverlay();
          }
        }
      }
    };
  </script>
  <script>
    // Both display modes intentionally mount the complete official dataset.
    // The content-addressed HTTP cache makes subsequent visits cheap and
    // avoids any visual resource appearing after a scene has already started.
    document.write('<script src="./openwyd_assets.js"><\/script>');
  </script>
  <script src="./tmproject_startup.js"></script>
</body>
</html>
