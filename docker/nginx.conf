map $http_accept_encoding $openwyd_encoding_suffix {
    default "";
    ~*br ".br";
    ~*gzip ".gz";
}

map $openwyd_encoding_suffix $openwyd_content_encoding {
    default "";
    ".br" "br";
    ".gz" "gzip";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /ws {
        proxy_pass http://wsproxy:8282;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~ ^/(index|startup_harness)\.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/(openwyd_assets|tmproject_startup)(\.state\.json|\.js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /openwyd_loading.png {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.mp3$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* "^(?<openwyd_asset_uri>/.*\.[0-9a-f]{16,}\.(data|js|wasm))$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Encoding $openwyd_content_encoding always;
        add_header Vary "Accept-Encoding" always;
        try_files $openwyd_asset_uri$openwyd_encoding_suffix $openwyd_asset_uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream data;
        application/json json;
    }
}

